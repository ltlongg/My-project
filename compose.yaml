# Môi trường phát triển: Postgres. Vector nhúng lấy từ dịch vụ ngoài (xem EMBEDDING_* trong .env).
# bằng uv.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bulletin
      POSTGRES_PASSWORD: bulletin
      POSTGRES_DB: bulletin
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulletin -d bulletin"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
