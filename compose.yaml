# Môi trường phát triển: Postgres và dịch vụ tạo vector nhúng. Ứng dụng chạy trực tiếp trên máy
# bằng uv.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bulletin
      POSTGRES_PASSWORD: bulletin
      POSTGRES_DB: bulletin
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulletin -d bulletin"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Model nhúng BAAI/bge-m3 để gom Tin, qua endpoint /v1/embeddings tương thích OpenAI. Lần đầu tải
  # khoảng 2,3 GB model về volume `embeddings`; khi chạy chiếm khoảng 3,2 GB RAM (xem
  # docs/clustering.md).
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    # Lô nhỏ thì lúc làm nóng model không cần nhiều RAM; Bài gốc được nhúng chỉ là tiêu đề và mô
    # tả ngắn, nên cắt bớt văn bản dài không mất gì.
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "2048", "--auto-truncate"]
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-54321}:80"
    volumes:
      - embeddings:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 120

volumes:
  db:
  embeddings:
